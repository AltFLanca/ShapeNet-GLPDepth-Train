[project]
name = "shapenetsem-depth"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10.19"
dependencies = [
    "albumentations>=2.0.8",
    "depth-anything-3>=0.1.1",
    "gdown>=6.4.0",
    "ipykernel>=7.2.0",
    "mmcv<2",
    "opencv-python==4.5.5.64",
    "opencv-python-headless==4.9.0.80",
    "openexr>=3.4.6",
    "pandas>=2.3.3",
    "setuptools<82",
    "timm>=1.0.25",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "transformers>=5.3.0.dev0",
]

[tool.uv]
build-constraint-dependencies = ["setuptools<82"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
transformers = { git = "https://github.com/huggingface/transformers.git" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipympl>=0.10.0",
]
